name: Deploy site

# Pull requests run the build job and stop there. Before this, nothing tested a PR at
# all: three Dependabot PRs sat for a week with no signal, and one of them (#175) could
# not even `npm ci`, because Dependabot bumped fumadocs-core without the aliased
# fumadocs-ui whose peer pins it exactly. CI would have said so on day one.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Per-ref, so a pull request's run cannot cancel main's deployment. Main keeps the old
# behaviour: two quick pushes share a ref, and the later one wins.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      # The starter repo readers instantiate carries copies of our compose file and
      # server config. This repo is the source of truth (see CLAUDE.md); if they drift,
      # chapters quote output that no longer matches what readers actually run.
      - name: Starter repo has not drifted
        working-directory: .
        run: |
          base=https://raw.githubusercontent.com/ronitjadhav/odoolings-starter/main
          fail=0
          for f in docker-compose.yml odoo.conf; do
            curl -fsSL "$base/$f" -o "/tmp/starter-$f" || { echo "::error::cannot fetch $f from the starter"; exit 1; }
            if ! diff -u "code/$f" "/tmp/starter-$f"; then
              echo "::error::code/$f differs from the starter's copy. Mirror it over, do not relax this check."
              fail=1
            fi
          done
          exit $fail
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:export
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: web/out

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # v5, not v4: v4 declares `using: node20`, and the runners now force node20
      # actions onto Node 24 ("Node.js 20 is deprecated ... being forced to run on
      # Node.js 24"). That is when this job started failing, on 2026-08-06: the same
      # artifact deployed at 11:38 and then would not at 11:59, every attempt reaching
      # deployment_in_progress and timing out, with Pages reporting operational and no
      # incidents. v5 declares node24. See the §10 changelog.
      - id: deployment
        uses: actions/deploy-pages@v5
