name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      # The starter repo readers instantiate carries copies of our compose file and
      # server config. This repo is the source of truth (see CLAUDE.md); if they drift,
      # chapters quote output that no longer matches what readers actually run.
      - name: Starter repo has not drifted
        working-directory: .
        run: |
          base=https://raw.githubusercontent.com/ronitjadhav/odoo-tutorial-starter/main
          fail=0
          for f in docker-compose.yml odoo.conf; do
            curl -fsSL "$base/$f" -o "/tmp/starter-$f" || { echo "::error::cannot fetch $f from the starter"; exit 1; }
            if ! diff -u "code/$f" "/tmp/starter-$f"; then
              echo "::error::code/$f differs from the starter's copy. Mirror it over, do not relax this check."
              fail=1
            fi
          done
          exit $fail
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
